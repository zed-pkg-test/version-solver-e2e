name: live-mutex-crosslang-e2e

on:
  pull_request:
    paths:
      - ".github/workflows/live-mutex-crosslang-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-mutex-crosslang-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_MUTEX_NODE_SHA: 9eb8b67a4f7f335400ac14b144c4934280099fb5
  LIVE_MUTEX_RUST_SHA: 9b3c1eea4c78c8a8164fb329a6dd6ce65b680bd4

jobs:
  live-mutex-node-broker:
    name: live-mutex / 9 client languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LMX_HOST: 127.0.0.1
      LMX_PORT: "6970"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.9.0"

      - name: Check required hosted-runner toolchains
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash cargo c++ docker go java mvn node npm pwsh python3 rustc; do
            command -v "$tool" >/dev/null || {
              echo "missing required toolchain: $tool" >&2
              exit 1
            }
          done
          gleam --version

      - name: Checkout pinned live-mutex source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ORESoftware/live-mutex.git live-mutex
          git -C live-mutex checkout --detach "$LIVE_MUTEX_NODE_SHA"
          test "$(git -C live-mutex rev-parse HEAD)" = "$LIVE_MUTEX_NODE_SHA"

      - name: Build Node broker
        shell: bash
        run: |
          set -euo pipefail
          cd live-mutex
          npm install --ignore-scripts
          npm run compile

      - name: Start Node broker and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          cd live-mutex
          node -e 'const {Broker1}=require("./dist/main.js"); new Broker1({port:6970,host:"127.0.0.1"}).ensure().then(()=>console.log("broker-ready"));' > ../node-broker.log 2>&1 &
          echo $! > ../node-broker.pid
          cd ..
          for attempt in $(seq 1 40); do
            if python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",6970),0.25); s.close()'; then
              exit 0
            fi
            sleep 0.25
          done
          cat node-broker.log >&2 || true
          exit 1

      - name: Client 1/9 — Rust
        id: node_rust
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/rust && cargo run --example smoke

      - name: Client 2/9 — Python
        id: node_python
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/python && PYTHONPATH=src python3 -m live_mutex_client.smoke

      - name: Client 3/9 — Shell
        id: node_shell
        continue-on-error: true
        shell: bash
        run: ./live-mutex/clients/shell/smoke.sh

      - name: Client 4/9 — PowerShell
        id: node_powershell
        continue-on-error: true
        shell: bash
        run: pwsh ./live-mutex/clients/powershell/smoke.ps1

      - name: Client 5/9 — Go
        id: node_go
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/go && go run ./cmd/smoke

      - name: Client 6/9 — Dart
        id: node_dart
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=host \
            -v "$PWD/live-mutex/clients/dart:/work" \
            -w /work \
            -e LMX_HOST=127.0.0.1 \
            -e LMX_PORT=6970 \
            dart:stable \
            sh -lc 'dart pub get >/dev/null && dart run example/smoke.dart'

      - name: Client 7/9 — Java
        id: node_java
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/java && mvn -q exec:java

      - name: Client 8/9 — C++
        id: node_cpp
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/cpp && make test && make run

      - name: Client 9/9 — Gleam
        id: node_gleam
        continue-on-error: true
        shell: bash
        run: cd live-mutex/clients/gleam && LIVE_MUTEX_SMOKE=1 gleam test

      - name: Require all 9 live-mutex clients to pass
        if: always()
        shell: bash
        env:
          RUST: ${{ steps.node_rust.outcome }}
          PYTHON: ${{ steps.node_python.outcome }}
          SHELL: ${{ steps.node_shell.outcome }}
          POWERSHELL: ${{ steps.node_powershell.outcome }}
          GO: ${{ steps.node_go.outcome }}
          DART: ${{ steps.node_dart.outcome }}
          JAVA: ${{ steps.node_java.outcome }}
          CPP: ${{ steps.node_cpp.outcome }}
          GLEAM: ${{ steps.node_gleam.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for name in RUST PYTHON SHELL POWERSHELL GO DART JAVA CPP GLEAM; do
            outcome="${!name}"
            printf '%-12s %s\n' "$name" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Node broker diagnostics
        if: always()
        shell: bash
        run: |
          cat node-broker.log || true
          if test -f node-broker.pid; then
            kill "$(cat node-broker.pid)" 2>/dev/null || true
          fi

  live-mutex-rust-broker:
    name: live-mutex-rs / 9 client languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_MUTEX_HOST: 127.0.0.1
      LIVE_MUTEX_PORT: "6970"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check required hosted-runner toolchains
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash cargo c++ dotnet go java javac node npm pwsh python3 rustc; do
            command -v "$tool" >/dev/null || {
              echo "missing required toolchain: $tool" >&2
              exit 1
            }
          done
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Checkout pinned live-mutex-rs source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ORESoftware/live-mutex-rs.git live-mutex-rs
          git -C live-mutex-rs checkout --detach "$LIVE_MUTEX_RUST_SHA"
          test "$(git -C live-mutex-rs rev-parse HEAD)" = "$LIVE_MUTEX_RUST_SHA"

      - name: Validate client protocol parity
        shell: bash
        run: cd live-mutex-rs && ./clients/check-protocol-parity.sh

      - name: Build Rust broker
        shell: bash
        run: cd live-mutex-rs && cargo build --release --no-default-features --bin dd-rust-network-mutex

      - name: Start Rust broker and prove readiness
        shell: bash
        run: |
          set -euo pipefail
          ./live-mutex-rs/target/release/dd-rust-network-mutex > rust-broker.log 2>&1 &
          echo $! > rust-broker.pid
          for attempt in $(seq 1 40); do
            if python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",6970),0.25); s.close()'; then
              exit 0
            fi
            sleep 0.25
          done
          cat rust-broker.log >&2 || true
          exit 1

      - name: Client 1/9 — TypeScript
        id: rust_ts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd live-mutex-rs/clients/ts
          pnpm install --frozen-lockfile=false
          pnpm smoke

      - name: Client 2/9 — Go
        id: rust_go
        continue-on-error: true
        shell: bash
        run: cd live-mutex-rs/clients/go && go run ./cmd/smoke

      - name: Client 3/9 — Python
        id: rust_python
        continue-on-error: true
        shell: bash
        run: cd live-mutex-rs/clients/python && python3 -m unittest discover -s tests -p 'test_*.py' -q && python3 smoke.py

      - name: Client 4/9 — C++
        id: rust_cpp
        continue-on-error: true
        shell: bash
        run: cd live-mutex-rs/clients/cpp && make test && make run

      - name: Client 5/9 — Java
        id: rust_java
        continue-on-error: true
        shell: bash
        run: cd live-mutex-rs/clients/java && ./build.sh && java -cp out com.oresoftware.networkmutex.ProtocolTest && java -cp out com.oresoftware.networkmutex.Smoke

      - name: Client 6/9 — C#
        id: rust_csharp
        continue-on-error: true
        shell: bash
        run: dotnet run --project live-mutex-rs/clients/csharp

      - name: Client 7/9 — F#
        id: rust_fsharp
        continue-on-error: true
        shell: bash
        run: dotnet run --project live-mutex-rs/clients/fsharp

      - name: Client 8/9 — Shell
        id: rust_shell
        continue-on-error: true
        shell: bash
        run: ./live-mutex-rs/clients/shell/smoke.sh

      - name: Client 9/9 — PowerShell
        id: rust_powershell
        continue-on-error: true
        shell: bash
        run: pwsh ./live-mutex-rs/clients/powershell/smoke.ps1

      - name: Require all 9 live-mutex-rs clients to pass
        if: always()
        shell: bash
        env:
          TYPESCRIPT: ${{ steps.rust_ts.outcome }}
          GO: ${{ steps.rust_go.outcome }}
          PYTHON: ${{ steps.rust_python.outcome }}
          CPP: ${{ steps.rust_cpp.outcome }}
          JAVA: ${{ steps.rust_java.outcome }}
          CSHARP: ${{ steps.rust_csharp.outcome }}
          FSHARP: ${{ steps.rust_fsharp.outcome }}
          SHELL: ${{ steps.rust_shell.outcome }}
          POWERSHELL: ${{ steps.rust_powershell.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for name in TYPESCRIPT GO PYTHON CPP JAVA CSHARP FSHARP SHELL POWERSHELL; do
            outcome="${!name}"
            printf '%-12s %s\n' "$name" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Rust broker diagnostics
        if: always()
        shell: bash
        run: |
          cat rust-broker.log || true
          if test -f rust-broker.pid; then
            kill "$(cat rust-broker.pid)" 2>/dev/null || true
          fi
