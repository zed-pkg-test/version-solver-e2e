name: deterministic solver identity acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solver-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Prove solver cache identity is order-independent and ecosystem-safe
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const stableSolveKey = ({ ecosystem, packageName, constraints }) => {
            if (!ecosystem || !packageName) throw new TypeError('missing solver identity');
            const normalized = [...constraints].map(String).sort();
            return JSON.stringify({ ecosystem, package_name: packageName, constraints: normalized });
          };

          const a = stableSolveKey({ ecosystem: 'npm', packageName: '@scope/pkg', constraints: ['>=1.2.0', '<2.0.0'] });
          const b = stableSolveKey({ ecosystem: 'npm', packageName: '@scope/pkg', constraints: ['<2.0.0', '>=1.2.0'] });
          assert.equal(a, b, 'constraint ordering must not alter solver identity');
          assert.notEqual(a, stableSolveKey({ ecosystem: 'cargo', packageName: '@scope/pkg', constraints: ['>=1.2.0', '<2.0.0'] }));
          assert.notEqual(a, stableSolveKey({ ecosystem: 'npm', packageName: 'scope/pkg', constraints: ['>=1.2.0', '<2.0.0'] }));

          const candidates = ['1.9.0', '1.10.0', '1.10.1'];
          const tuple = v => v.split('.').map(Number);
          const cmp = (x, y) => {
            const a = tuple(x), b = tuple(y);
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
            return 0;
          };
          assert.equal([...candidates].sort(cmp).at(-1), '1.10.1', 'solver ordering must be semantic, not lexical');
          NODE
