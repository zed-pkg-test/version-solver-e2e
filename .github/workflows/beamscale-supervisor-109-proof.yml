name: BeamScale supervisor #109 exact-head proof

on:
  pull_request:
  push:
    branches:
      - proof/beamscale-supervisor-109-20260926

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: a701fdada843424e00874e64ed209abd96442385
    steps:
      - name: Check out proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconstruct and verify exact private source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          expected_commit = "a701fdada843424e00874e64ed209abd96442385"
          pack_dir = pathlib.Path("carrier/beamscale-supervisor-109")
          output = pathlib.Path("source")
          packs = sorted(pack_dir.glob("pack-*.json"))
          if len(packs) != 9:
              raise SystemExit(f"expected 9 source packs, found {len(packs)}")

          seen = set()
          count = 0
          for pack_path in packs:
              pack = json.loads(pack_path.read_text(encoding="utf-8"))
              if pack.get("source_repo") != "beamscale/bmscl-supervisor":
                  raise SystemExit(f"wrong source repo in {pack_path}")
              if pack.get("source_commit") != expected_commit:
                  raise SystemExit(f"wrong source commit in {pack_path}")
              for item in pack.get("files", []):
                  rel = pathlib.PurePosixPath(item["path"])
                  if rel.is_absolute() or ".." in rel.parts or "." in rel.parts:
                      raise SystemExit(f"unsafe vendored path: {rel}")
                  if item["path"] in seen:
                      raise SystemExit(f"duplicate vendored path: {rel}")
                  seen.add(item["path"])

                  data = item["content"].encode("utf-8")
                  header = f"blob {len(data)}\0".encode("ascii")
                  actual = hashlib.sha1(header + data).hexdigest()
                  if actual != item["sha"]:
                      raise SystemExit(
                          f"Git blob mismatch for {rel}: expected {item['sha']} got {actual}"
                      )

                  dest = output.joinpath(*rel.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  if item.get("mode") == "100755":
                      dest.chmod(0o755)
                  count += 1

          if count != 117:
              raise SystemExit(f"expected 117 exact source files, reconstructed {count}")
          if "rebar.config" not in seen:
              raise SystemExit("rebar.config missing from exact source snapshot")
          if not any(path.startswith("src/") for path in seen):
              raise SystemExit("src closure missing")
          if not any(path.startswith("test/") for path in seen):
              raise SystemExit("test closure missing")

          print(json.dumps({
              "source_repo": "beamscale/bmscl-supervisor",
              "source_commit": expected_commit,
              "verified_git_blobs": count,
          }, sort_keys=True))
          PY
      - name: Set up OTP, Rebar3, and Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3'
          rebar3-version: '3.24.0'
          gleam-version: '1.18.0'
      - name: Compile
        working-directory: source
        run: rebar3 compile
      - name: EUnit
        working-directory: source
        run: rebar3 eunit
      - name: Xref
        working-directory: source
        run: rebar3 xref
      - name: Prove Hosted Gleam ABI fixture
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cd test/fixtures/hosted_abi
          gleam build
          beam_dir="$(dirname "$(find build -type f -name worker.beam -print -quit)")"
          test -n "$beam_dir"
          erl -noshell -pa "$beam_dir" -eval '
            Request = {request, <<"POST">>, <<"/abi">>,
                       [{<<"content-type">>, <<"application/octet-stream">>}],
                       <<0,1,2>>},
            Context = {context,
                       {cluster_capability, <<"cluster">>},
                       {some, {http_capability, <<"http">>}},
                       {log_capability, <<"log">>},
                       none,
                       123},
            {response, 201, Headers, <<0,1,2>>} = worker:handle(Request, Context),
            true = lists:member({<<"x-method">>, <<"POST">>}, Headers),
            true = lists:member({<<"x-url">>, <<"/abi">>}, Headers),
            true = lists:member({<<"x-capabilities">>, <<"http-only">>}, Headers),
            true = lists:member({<<"x-deadline">>, <<"123">>}, Headers),
            halt(0).'
      - name: Build self-contained OTP release
        working-directory: source
        run: rebar3 release
      - name: Smoke self-contained release files
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rel=_build/default/rel/bmscl_supervisor
          test -x "$rel/bin/bmscl_supervisor"
          test -f "$rel/releases/0.1.0/start.boot"
          test -n "$(find "$rel" -path '*/erts-*/bin/beam.smp' -type f -print -quit)"
