name: format and verify DEN-3488 Rust contract

on:
  push:
    branches:
      - feat/den-3488-multiversion-cycle-e2e

permissions:
  contents: write

jobs:
  format-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[den-3488-rustfmt]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt
      - name: Format
        run: rustfmt --edition 2024 tests/multiversion_cycle_contract.rs
      - name: Compile with warnings denied
        run: rustc --edition 2024 -D warnings --test tests/multiversion_cycle_contract.rs -o /tmp/multiversion-cycle-contract
      - name: Run exact-node and real-symlink tests
        run: /tmp/multiversion-cycle-contract --nocapture
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/multiversion_cycle_contract.rs
          if git diff --cached --quiet; then
            echo "Rust contract was already formatted"
          else
            git commit -m "style(DEN-3488): rustfmt external cycle contract [den-3488-rustfmt]"
            git push origin HEAD:feat/den-3488-multiversion-cycle-e2e
          fi
